name: daily-post

on:
  schedule:
    - cron: "0 9 * * *"    # 毎日 09:00 UTC ＝ 17:00 セブ・香港 → いつもの予定表（slot 17）
    - cron: "0 12 * * *"   # 毎日 12:00 UTC ＝ 20:00 セブ・香港 → 旅先のリアルタイム（slot 20）
    # GitHub側の都合で数分〜数十分遅れることがある
  workflow_dispatch:        # 手動でも実行できる（Actions タブの「Run workflow」）
    inputs:
      slot:
        description: "どちらの枠を出すか（17 か 20）"
        default: "17"

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load token
        # 毎週取りかえた新しいトークン（token.enc）を使う。無い・開けないときは Secret のものを使う
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          FALLBACK: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          T=""
          if [ -f token.enc ] && [ -n "$TOKEN_KEY" ]; then
            T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -a -A -pass env:TOKEN_KEY -in token.enc 2>/dev/null) || T=""
          fi
          if [ -z "$T" ]; then echo "token.enc が使えないので Secret のトークンを使います"; T="$FALLBACK"; fi
          echo "::add-mask::$T"
          echo "THREADS_ACCESS_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Post today's item
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '0 12 * * *' && '20' || '17') }}
        run: python post.py --slot "$SLOT"
      - name: Save queue.json
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "posted: $(date -u +%Y-%m-%d) slot ${{ github.event_name == 'workflow_dispatch' && inputs.slot || (github.event.schedule == '0 12 * * *' && '20' || '17') }}"
          git pull --rebase
          git push
