name: daily-post

on:
  # 起こし方は2つ。どちらで起きても、post.py が「今の時間帯の枠が、今日まだ出ていないか」を見て判断するので二重には出ない。
  # ① 外の目覚まし（cron-job.org）が毎日 17:05/17:35/20:05/20:35（セブ）に「Run workflow」を押す ← メイン（11/18〜）
  # ② GitHub の予約（予備）。このリポジトリではほとんど動かない（11/16〜17 は2日で2回、しかも時間外）
  schedule:
    - cron: "7,37 9-15 * * *"   # 09:07〜15:37 UTC ＝ 17:07〜23:37 セブ（予備）
  workflow_dispatch:
    inputs:
      slot:
        description: "空のまま＝今の時刻で判断（目覚まし用）。17 か 20 を入れると時間に関係なく出す"
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 順番待ちの間に別の回が投稿していても、最新の予定表を読む（二重投稿を防ぐ）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load token
        # 毎週取りかえた新しいトークン（token.enc）を使う。無い・開けないときは Secret のものを使う
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          FALLBACK: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          T=""
          if [ -f token.enc ] && [ -n "$TOKEN_KEY" ]; then
            T=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -a -A -pass env:TOKEN_KEY -in token.enc 2>/dev/null) || T=""
          fi
          if [ -z "$T" ]; then echo "token.enc が使えないので Secret のトークンを使います"; T="$FALLBACK"; fi
          echo "::add-mask::$T"
          echo "THREADS_ACCESS_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Post today's item
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          MANUAL_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || '' }}
        run: |
          if [ -n "$MANUAL_SLOT" ]; then python post.py --slot "$MANUAL_SLOT" --force; else python post.py; fi
      - name: Save queue.json
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "posted: $(TZ=Asia/Manila date +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
