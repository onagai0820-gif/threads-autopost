name: daily-post

on:
  schedule:
    - cron: "0 9 * * *"   # 毎日 09:00 UTC ＝ 17:00 セブ・香港（GitHub側の都合で数分〜数十分遅れることがある）
  workflow_dispatch:       # 手動でも実行できる（Actions タブの「Run workflow」）

permissions:
  contents: write

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's item
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python post.py
      - name: Save queue.json
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "posted: $(date -u +%Y-%m-%d)"
          git push
